name: Build Static Android avr-gcc

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level"
        default: "28"
        required: true
      binutils_version:
        default: "2.47"
        required: true
      gcc_version:
        default: "15.2.0"
        required: true
      avrlibc_version:
        default: "2.3.2"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail

env:
  GMP_VERSION: "6.3.0"
  MPFR_VERSION: "4.2.2"
  MPC_VERSION: "1.3.1"
  NATIVE_PREFIX: "/opt/native-avr"
  NDK_VERSION: "29.0.14206865"
  # Chips whose crt*.o files are kept in the final toolchain (space separated).
  # Set to "" to keep every chip.
  KEEP_CHIPS: "atmega328p atmega328pb atmega328 atmega168 atmega168p atmega88 atmega48 atmega8 atmega16 atmega32 atmega128 atmega1280 atmega2560 atmega32u4 atmega16u2 atmega8u2 atmega644p atmega1284p attiny85 attiny84 attiny45 attiny44 attiny25 attiny24 attiny13 attiny13a attiny2313 attiny4313 attiny88"

jobs:
  # ---------------------------------------------------------------------------
  build-native:
    name: Build Native Linux -> AVR
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free disk space & pick workdir
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/share/chromium || true
          docker image prune -af || true

          if [ -d /mnt ] && [ "$(df -Pm /mnt | awk 'NR==2{print $4}')" -gt 30000 ]; then
            WORK="/mnt/avr-work"
          else
            WORK="$RUNNER_TEMP/avr-work"
          fi
          sudo mkdir -p "$WORK" "$NATIVE_PREFIX"
          sudo chown -R "$USER:$USER" "$WORK" "$NATIVE_PREFIX"
          mkdir -p "$WORK/logs"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "LOGS=$WORK/logs" >> "$GITHUB_ENV"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo gawk m4 \
            curl xz-utils bzip2 zstd libgmp-dev libmpfr-dev libmpc-dev

      - name: Download & extract sources
        run: |
          mkdir -p "$WORK/src" "$WORK/build"
          cd "$WORK/src"
          curl -fL --retry 5 --retry-all-errors -O "https://ftpmirror.gnu.org/gnu/binutils/binutils-${{ inputs.binutils_version || '2.47' }}.tar.xz"
          curl -fL --retry 5 --retry-all-errors -O "https://ftpmirror.gnu.org/gnu/gcc/gcc-${{ inputs.gcc_version || '15.2.0' }}/gcc-${{ inputs.gcc_version || '15.2.0' }}.tar.xz"
          AVRLIBC_VER="${{ inputs.avrlibc_version || '2.3.2' }}"
          AVRLIBC_TAG="avr-libc-${AVRLIBC_VER//./_}-release"
          curl -fL --retry 5 --retry-all-errors -O "https://github.com/avrdudes/avr-libc/releases/download/${AVRLIBC_TAG}/avr-libc-${AVRLIBC_VER}.tar.bz2"

          tar -xf "binutils-${{ inputs.binutils_version || '2.47' }}.tar.xz"
          tar -xf "gcc-${{ inputs.gcc_version || '15.2.0' }}.tar.xz"
          tar -xf "avr-libc-${AVRLIBC_VER}.tar.bz2"
          rm -f *.tar.*

      - name: Build native binutils
        run: |
          exec > >(tee -a "$LOGS/native-binutils.log") 2>&1
          mkdir -p "$WORK/build/binutils" && cd "$WORK/build/binutils"
          "$WORK/src/binutils-${{ inputs.binutils_version || '2.47' }}/configure" \
            --prefix="$NATIVE_PREFIX" --target=avr \
            --disable-nls --disable-werror --disable-gdb --disable-sim \
            --disable-gold --disable-gprofng --disable-plugins --without-zstd
          make -j"$(nproc)" || make -j1
          make install
          rm -rf "$WORK/build/binutils"

      - name: Build native gcc
        run: |
          exec > >(tee -a "$LOGS/native-gcc.log") 2>&1
          export PATH="$NATIVE_PREFIX/bin:$PATH"
          mkdir -p "$WORK/build/gcc" && cd "$WORK/build/gcc"
          "$WORK/src/gcc-${{ inputs.gcc_version || '15.2.0' }}/configure" \
            --prefix="$NATIVE_PREFIX" --target=avr \
            --enable-languages=c,c++ --with-avrlibc --with-dwarf2 \
            --enable-fixed-point --disable-nls --disable-shared \
            --disable-threads --disable-libssp --disable-libquadmath \
            --disable-libgomp --disable-libatomic --disable-libstdcxx \
            --disable-libada --disable-libcc1 --disable-plugin --disable-lto \
            --without-isl --without-zstd
          make -j"$(nproc)" all-gcc all-target-libgcc || make -j1 all-gcc all-target-libgcc
          make install-gcc install-target-libgcc
          rm -rf "$WORK/build/gcc"

      - name: Build native avr-libc
        run: |
          exec > >(tee -a "$LOGS/native-avrlibc.log") 2>&1
          export PATH="$NATIVE_PREFIX/bin:$PATH"
          mkdir -p "$WORK/build/avrlibc" && cd "$WORK/build/avrlibc"
          "$WORK/src/avr-libc-${{ inputs.avrlibc_version || '2.3.2' }}/configure" \
            --prefix="$NATIVE_PREFIX" --build="$(gcc -dumpmachine)" --host=avr
          make -j"$(nproc)"
          make install
          tar --zstd -cf "$WORK/native-avr.tar.zst" -C /opt native-avr

      - name: Upload native toolchain for Android matrix jobs
        uses: actions/upload-artifact@v7
        with:
          name: native-avr
          path: ${{ env.WORK }}/native-avr.tar.zst
          compression-level: 0
          retention-days: 5
          if-no-files-found: error

      - name: Collect errors
        if: failure()
        run: |
          set +o pipefail
          {
            echo "## First errors (native)"
            echo '```'
            grep -rhE -B2 -A6 -m3 "error:|fatal error|undefined reference|\*\*\* \[" "$LOGS" | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          (cd "$WORK/build" 2>/dev/null && find . -name config.log -print0 | tar --null -T - -czf "$LOGS/config-logs.tgz") || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-native
          path: ${{ env.WORK }}/logs
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (${{ matrix.abi }})
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            host: aarch64-linux-android
            gmp_flags: ""
          - abi: armeabi-v7a
            host: armv7a-linux-androideabi
            gmp_flags: "--disable-assembly"
          - abi: x86_64
            host: x86_64-linux-android
            gmp_flags: ""

    steps:
      - name: Free disk space & pick workdir
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/share/chromium || true
          docker image prune -af || true

          if [ -d /mnt ] && [ "$(df -Pm /mnt | awk 'NR==2{print $4}')" -gt 30000 ]; then
            WORK="/mnt/avr-work"
          else
            WORK="$RUNNER_TEMP/avr-work"
          fi
          sudo mkdir -p "$WORK" "$NATIVE_PREFIX"
          sudo chown -R "$USER:$USER" "$WORK" "$NATIVE_PREFIX"
          mkdir -p "$WORK/logs"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "LOGS=$WORK/logs" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo gawk m4 \
            curl xz-utils bzip2 zstd file zip

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          "$SDKM" --install "ndk;${NDK_VERSION}" < <(yes)
          test -d "$SDK/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Prepare linker shim (64-byte TLS alignment + 16 KB pages)
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ inputs.api_level || '28' }}"
          echo '__thread char avr_tls_pad[1] __attribute__((used, aligned(64)));' > "$WORK/tls64.c"
          "$NDK_BIN/${{ matrix.host }}${API}-clang" -c -O2 "$WORK/tls64.c" -o "$WORK/tls64.o"
          echo "EXTRA_LD=$WORK/tls64.o -Wl,-z,max-page-size=16384" >> "$GITHUB_ENV"
          "$NDK_BIN/clang" --version | head -1

      - name: Download native toolchain
        uses: actions/download-artifact@v8
        with:
          name: native-avr
          path: ${{ env.WORK }}

      - name: Extract native toolchain & download sources
        run: |
          tar --zstd -xf "$WORK/native-avr.tar.zst" -C /opt
          rm -f "$WORK/native-avr.tar.zst"

          mkdir -p "$WORK/src" "$WORK/build" "$WORK/host-libs" "$WORK/out/avr-gcc"
          cd "$WORK/src"
          curl -fL --retry 5 --retry-all-errors -O "https://ftpmirror.gnu.org/gnu/gmp/gmp-${GMP_VERSION}.tar.xz"
          curl -fL --retry 5 --retry-all-errors -O "https://ftpmirror.gnu.org/gnu/mpfr/mpfr-${MPFR_VERSION}.tar.xz"
          curl -fL --retry 5 --retry-all-errors -O "https://ftpmirror.gnu.org/gnu/mpc/mpc-${MPC_VERSION}.tar.gz"
          curl -fL --retry 5 --retry-all-errors -O "https://ftpmirror.gnu.org/gnu/binutils/binutils-${{ inputs.binutils_version || '2.47' }}.tar.xz"
          curl -fL --retry 5 --retry-all-errors -O "https://ftpmirror.gnu.org/gnu/gcc/gcc-${{ inputs.gcc_version || '15.2.0' }}/gcc-${{ inputs.gcc_version || '15.2.0' }}.tar.xz"
          AVRLIBC_VER="${{ inputs.avrlibc_version || '2.3.2' }}"
          AVRLIBC_TAG="avr-libc-${AVRLIBC_VER//./_}-release"
          curl -fL --retry 5 --retry-all-errors -O "https://github.com/avrdudes/avr-libc/releases/download/${AVRLIBC_TAG}/avr-libc-${AVRLIBC_VER}.tar.bz2"

          for f in *.tar.*; do tar -xf "$f"; done
          rm -f *.tar.*

      - name: Cross-compile static GMP, MPFR, MPC
        run: |
          exec > >(tee -a "$LOGS/gmp-mpfr-mpc-${{ matrix.abi }}.log") 2>&1
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ inputs.api_level || '28' }}"
          HOST="${{ matrix.host }}"
          BUILD="$(gcc -dumpmachine)"

          export CC="$NDK_BIN/${HOST}${API}-clang"
          export AR="$NDK_BIN/llvm-ar"
          export RANLIB="$NDK_BIN/llvm-ranlib"
          export NM="$NDK_BIN/llvm-nm"
          export STRIP="$NDK_BIN/llvm-strip"
          export CFLAGS="-O2 -std=gnu17"

          mkdir -p "$WORK/build/gmp" && cd "$WORK/build/gmp"
          "$WORK/src/gmp-${GMP_VERSION}/configure" \
            --build="$BUILD" --host="$HOST" --prefix="$WORK/host-libs" \
            --disable-shared --enable-static ${{ matrix.gmp_flags }}
          make -j"$(nproc)" && make install

          mkdir -p "$WORK/build/mpfr" && cd "$WORK/build/mpfr"
          "$WORK/src/mpfr-${MPFR_VERSION}/configure" \
            --build="$BUILD" --host="$HOST" --prefix="$WORK/host-libs" \
            --with-gmp="$WORK/host-libs" --disable-shared --enable-static
          make -j"$(nproc)" && make install

          mkdir -p "$WORK/build/mpc" && cd "$WORK/build/mpc"
          "$WORK/src/mpc-${MPC_VERSION}/configure" \
            --build="$BUILD" --host="$HOST" --prefix="$WORK/host-libs" \
            --with-gmp="$WORK/host-libs" --with-mpfr="$WORK/host-libs" \
            --disable-shared --enable-static
          make -j"$(nproc)" && make install

          rm -rf "$WORK/build/gmp" "$WORK/build/mpfr" "$WORK/build/mpc"

      - name: Cross-compile static avr-binutils
        run: |
          exec > >(tee -a "$LOGS/binutils-${{ matrix.abi }}.log") 2>&1
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ inputs.api_level || '28' }}"
          HOST="${{ matrix.host }}"
          BUILD="$(gcc -dumpmachine)"

          # posix_spawn is hidden in NDK headers below API 28 but exists in the
          # static libc.a, so configure's probe wrongly succeeds. Force the
          # fork/vfork fallback in libiberty.
          export ac_cv_func_posix_spawn=no ac_cv_func_posix_spawnp=no ac_cv_func_qsort_r=no

          mkdir -p "$WORK/build/binutils" && cd "$WORK/build/binutils"
          "$WORK/src/binutils-${{ inputs.binutils_version || '2.47' }}/configure" \
            --build="$BUILD" --host="$HOST" --target=avr \
            --prefix="$WORK/out/avr-gcc" \
            --disable-shared --enable-static \
            --disable-nls --disable-werror --disable-gdb --disable-sim \
            --disable-gold --disable-gprofng --disable-plugins --without-zstd \
            CC_FOR_BUILD=gcc CXX_FOR_BUILD=g++ \
            CFLAGS_FOR_BUILD="-O2" CXXFLAGS_FOR_BUILD="-O2" LDFLAGS_FOR_BUILD="" \
            CC="$NDK_BIN/${HOST}${API}-clang" \
            CXX="$NDK_BIN/${HOST}${API}-clang++" \
            AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
            NM="$NDK_BIN/llvm-nm" STRIP="$NDK_BIN/llvm-strip" \
            CFLAGS="-O2" CXXFLAGS="-O2" LDFLAGS="-static $EXTRA_LD"
          make -j"$(nproc)" configure-host

          # qsort_r is only declared in new NDK API levels but exists in libc.a:
          # make libctf use its own fallback
          if [ -f libctf/config.h ]; then
            sed -i -E 's|^#define HAVE_QSORT_R 1|/* & disabled */|' libctf/config.h
            grep -n "QSORT_R" libctf/config.h || true
          fi

          # belt and braces: disable posix_spawn in the generated config.h too
          if [ -f libiberty/config.h ]; then
            sed -i -E 's|^#define HAVE_POSIX_SPAWNP? 1|/* & disabled */|' libiberty/config.h
            grep -n "POSIX_SPAWN" libiberty/config.h || true
          fi

          LDF="-all-static $EXTRA_LD"
          make -j"$(nproc)" LDFLAGS="$LDF" LDFLAGS_FOR_BUILD="" \
            || make -j1 LDFLAGS="$LDF" LDFLAGS_FOR_BUILD=""
          make install LDFLAGS="$LDF" LDFLAGS_FOR_BUILD=""
          rm -rf "$WORK/build/binutils"

      - name: Cross-compile static avr-gcc
        run: |
          exec > >(tee -a "$LOGS/gcc-${{ matrix.abi }}.log") 2>&1
          export PATH="$NATIVE_PREFIX/bin:$PATH"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ inputs.api_level || '28' }}"
          HOST="${{ matrix.host }}"
          BUILD="$(gcc -dumpmachine)"

          export ac_cv_func_posix_spawn=no ac_cv_func_posix_spawnp=no ac_cv_func_qsort_r=no

          mkdir -p "$WORK/build/gcc" && cd "$WORK/build/gcc"
          "$WORK/src/gcc-${{ inputs.gcc_version || '15.2.0' }}/configure" \
            --build="$BUILD" --host="$HOST" --target=avr \
            --prefix="$WORK/out/avr-gcc" \
            --enable-languages=c,c++ --with-avrlibc --with-dwarf2 \
            --enable-fixed-point --disable-nls --disable-shared \
            --disable-threads --disable-libssp --disable-libquadmath \
            --disable-libgomp --disable-libatomic --disable-libstdcxx \
            --disable-libada --disable-libcc1 --disable-plugin --disable-lto \
            --without-isl --without-zstd \
            --with-gmp="$WORK/host-libs" \
            --with-mpfr="$WORK/host-libs" \
            --with-mpc="$WORK/host-libs" \
            CC_FOR_BUILD=gcc CXX_FOR_BUILD=g++ \
            CFLAGS_FOR_BUILD="-O2" CXXFLAGS_FOR_BUILD="-O2" LDFLAGS_FOR_BUILD="" \
            CC="$NDK_BIN/${HOST}${API}-clang" \
            CXX="$NDK_BIN/${HOST}${API}-clang++" \
            AR="$NDK_BIN/llvm-ar" RANLIB="$NDK_BIN/llvm-ranlib" \
            NM="$NDK_BIN/llvm-nm" STRIP="$NDK_BIN/llvm-strip" \
            CFLAGS="-O2" CXXFLAGS="-O2" LDFLAGS="-static -static-libstdc++ $EXTRA_LD" \
            AR_FOR_TARGET=avr-ar AS_FOR_TARGET=avr-as LD_FOR_TARGET=avr-ld \
            NM_FOR_TARGET=avr-nm RANLIB_FOR_TARGET=avr-ranlib STRIP_FOR_TARGET=avr-strip \
            CC_FOR_TARGET=avr-gcc CXX_FOR_TARGET=avr-g++ \
            CFLAGS_FOR_TARGET="-Os -g" CXXFLAGS_FOR_TARGET="-Os -g" LDFLAGS_FOR_TARGET=""

          # GCC has its own libiberty: apply the same posix_spawn fix
          make configure-libiberty
          if [ -f libiberty/config.h ]; then
            sed -i -E 's|^#define HAVE_POSIX_SPAWNP? 1|/* & disabled */|' libiberty/config.h
            grep -n "POSIX_SPAWN" libiberty/config.h || true
          fi

          make -j"$(nproc)" all-gcc all-target-libgcc \
            || make -j1 all-gcc all-target-libgcc
          make install-gcc install-target-libgcc
          rm -rf "$WORK/build/gcc"

      - name: Install avr-libc, slim & strip
        run: |
          exec > >(tee -a "$LOGS/avrlibc-${{ matrix.abi }}.log") 2>&1
          export PATH="$NATIVE_PREFIX/bin:$PATH"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="$WORK/out/avr-gcc"

          mkdir -p "$WORK/build/avrlibc" && cd "$WORK/build/avrlibc"
          "$WORK/src/avr-libc-${{ inputs.avrlibc_version || '2.3.2' }}/configure" \
            --prefix="$OUT" --build="$(gcc -dumpmachine)" --host=avr
          make -j"$(nproc)"
          make install

          # ---- slim ----
          cd "$OUT"
          rm -rf share include
          rm -f lib/libbfd* lib/libopcodes* lib/libsframe* lib/libctf* lib/libiberty*
          rm -rf lib/gcc/avr/*/plugin libexec/gcc/avr/*/plugin libexec/gcc/avr/*/install-tools
          find . -name '*.la' -delete

          if [ -n "$KEEP_CHIPS" ]; then
            find avr/lib -type f -name 'crt*.o' | while read -r f; do
              b="$(basename "$f" .o)"; chip="${b#crt}"
              case "$chip" in at*|avr*) ;; *) continue ;; esac
              case " $KEEP_CHIPS " in *" $chip "*) ;; *) rm -f "$f" ;; esac
            done
          fi

          # ---- strip ----
          find "$OUT/bin" "$OUT/avr/bin" "$OUT/libexec" \
            -type f -executable -exec "$NDK_BIN/llvm-strip" --strip-unneeded {} + 2>/dev/null || true

          echo "files: $(find "$OUT" -type f | wc -l)"; du -sh "$OUT"
          file "$OUT/bin/avr-gcc" "$OUT/bin/avr-ld" "$OUT"/libexec/gcc/avr/*/cc1plus
          "$NDK_BIN/llvm-readelf" -lW "$OUT/bin/avr-gcc" | grep -E "LOAD|TLS" || true

      - name: Package (full toolchain, jniLibs, sysroot)
        run: |
          exec > >(tee -a "$LOGS/package-${{ matrix.abi }}.log") 2>&1
          OUT="$WORK/out/avr-gcc"
          ABI="${{ matrix.abi }}"
          GCCV="${{ inputs.gcc_version || '15.2.0' }}"

          # 1) full toolchain, links dereferenced (works on filesystems without links)
          tar -h --hard-dereference -cJf "$WORK/avr-gcc-${GCCV}-android-${ABI}.tar.xz" \
            -C "$WORK/out" avr-gcc

          # 2) executables as lib*.so for app/src/main/jniLibs/<abi>/
          PKG="$WORK/pkg/jniLibs/$ABI"; mkdir -p "$PKG"
          pick() { for c in "$@"; do [ -f "$c" ] && { echo "$c"; return 0; }; done; \
                   echo "::error::none of these exist: $*" >&2; return 1; }
          put()  { cp -L "$(pick "${@:2}")" "$PKG/$1" && chmod 755 "$PKG/$1"; }

          put libavr-gcc.so     "$OUT/bin/avr-gcc"
          put libavr-ar.so      "$OUT/bin/avr-ar"
          put libavr-ranlib.so  "$OUT/bin/avr-ranlib"
          put libavr-objcopy.so "$OUT/bin/avr-objcopy"
          put libavr-size.so    "$OUT/bin/avr-size"
          put libavr-as.so      "$OUT/bin/avr-as"  "$OUT/avr/bin/as"
          put libavr-ld.so      "$OUT/bin/avr-ld"  "$OUT/avr/bin/ld.bfd" "$OUT/avr/bin/ld"
          put libcc1.so         $OUT/libexec/gcc/avr/*/cc1
          put libcc1plus.so     $OUT/libexec/gcc/avr/*/cc1plus
          put libcollect2.so    $OUT/libexec/gcc/avr/*/collect2

          ls -lh "$PKG"
          tar -cJf "$WORK/avr-gcc-${GCCV}-jnilibs-${ABI}.tar.xz" -C "$WORK/pkg" jniLibs

          # 3) data-only sysroot (headers, crt*.o, libc.a, libgcc.a) - same for all ABIs
          if [ "$ABI" = "arm64-v8a" ]; then
            SYS="$WORK/sysroot"; rm -rf "$SYS"; mkdir -p "$SYS/lib"
            cp -rL "$OUT/avr" "$SYS/"
            cp -rL "$OUT/lib/gcc" "$SYS/lib/"
            rm -rf "$SYS/avr/bin" "$SYS"/lib/gcc/avr/*/plugin
            (cd "$SYS" && zip -qr "$WORK/avr-gcc-${GCCV}-sysroot.zip" .)
          fi
          ls -lh "$WORK"/*.tar.xz "$WORK"/*.zip 2>/dev/null || true

      - name: Upload full toolchain artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.WORK }}/avr-gcc-*-android-${{ matrix.abi }}.tar.xz
          archive: false
          if-no-files-found: error

      - name: Upload jniLibs artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.WORK }}/avr-gcc-*-jnilibs-${{ matrix.abi }}.tar.xz
          archive: false
          if-no-files-found: error

      - name: Upload sysroot artifact
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.WORK }}/avr-gcc-*-sysroot.zip
          archive: false
          if-no-files-found: error

      - name: Verify Play Store compatibility (alignment)
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ABI="${{ matrix.abi }}"
          rc=0
          for f in "$WORK/pkg/jniLibs/$ABI"/*.so; do
            "$NDK_BIN/llvm-readelf" -lW "$f" | gawk -v f="$(basename "$f")" -v abi="$ABI" '
              $1=="LOAD" && abi!="armeabi-v7a" && strtonum($NF) < 16384 {
                printf "::error::%s LOAD align %s < 0x4000 (16 KB)\n", f, $NF; bad=1 }
              $1=="TLS" && abi=="arm64-v8a" && strtonum($NF) < 64 {
                printf "::error::%s TLS align %s < 0x40 (Bionic arm64)\n", f, $NF; bad=1 }
              END { exit bad }' || rc=1
          done
          [ "$rc" = 0 ] && echo "All jniLibs binaries pass the alignment checks."
          exit "$rc"

      - name: Collect errors
        if: failure()
        run: |
          set +o pipefail
          {
            echo "## First errors (${{ matrix.abi }})"
            echo '```'
            grep -rhE -B2 -A6 -m3 "error:|fatal error|undefined reference|\*\*\* \[" "$LOGS" | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          (cd "$WORK/build" 2>/dev/null && find . -name config.log -print0 | tar --null -T - -czf "$LOGS/config-logs.tgz") || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.abi }}
          path: ${{ env.WORK }}/logs
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built toolchains
        uses: actions/download-artifact@v8
        with:
          pattern: avr-gcc-*
          path: dist
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "avr-gcc ${GITHUB_REF_NAME} (Android static)" \
            --generate-notes
